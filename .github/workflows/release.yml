---
name: Release

"on":
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: macos-aarch64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        working-directory: cli
        run: cargo build --release

      - name: Create release tarball
        run: |
          mkdir -p release
          cp cli/target/release/setup release/
          tar -czvf "setup-${{ matrix.target }}.tar.gz" -C release setup

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: setup-${{ matrix.target }}
          path: setup-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum setup-*.tar.gz install.sh > checksums.txt

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Setup ${{ steps.version.outputs.VERSION }}
          body: |
            ## Setup CLI ${{ steps.version.outputs.VERSION }}

            Install this release (Linux x86_64 or macOS arm64):

            ```bash
            VERSION="${{ steps.version.outputs.VERSION }}"
            curl -fsSL "https://github.com/X-McKay/setup/releases/download/${VERSION}/install.sh" | \
              bash -s -- --version "${VERSION}"
            ```

            Manual assets:
            - `setup-linux-x86_64.tar.gz`
            - `setup-macos-aarch64.tar.gz`
            - `checksums.txt`

            See CHANGELOG.md for release details.
          files: |
            install.sh
            checksums.txt
            setup-linux-x86_64.tar.gz
            setup-macos-aarch64.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
